name: Finish verified release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the existing draft
        required: true
        type: string
      publish:
        description: Publish the draft when every package and signature verifies
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: finish-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      UPLOAD: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = true
          gh release download "v$VERSION" -D release-files
          gh release view "v$VERSION" --json assets > assets.json
      - name: Verify signatures and generate manifests
        run: node verify-release.mjs
      - name: Upload manifests and complete requested operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --json assets,isDraft > current.json
          node --input-type=module -e "import fs from 'node:fs';const before=JSON.parse(fs.readFileSync('assets.json')),after=JSON.parse(fs.readFileSync('current.json'));if(!after.isDraft||!before.assets.every(a=>after.assets.some(b=>b.name===a.name&&b.digest===a.digest)))throw Error('Draft changed. Repeat verification.')"
          gh release upload "v$VERSION" release-files/{vayxo-manifest.json,latest.json,SHA256SUMS.txt} --clobber
          if [ "$UPLOAD" = true ]; then gh release edit "v$VERSION" --draft=false --latest; fi
